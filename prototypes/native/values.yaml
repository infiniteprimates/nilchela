# =============================================================================
# nilchela — native values (PROTOTYPE B)
#
# The same interface as prototype A — same keys, same defaults, same schema
# rules; only this header and the schema title name the prototype. That is
# deliberate: if the two interfaces diverge, the comparison is measuring the
# interface change as well as the implementation, and the result is worthless.
# Everything that differs between A and B lives under templates/.
# =============================================================================

image:
  repository: ghcr.io/infiniteprimates/nilchela
  # Empty means .Chart.AppVersion — the image version this chart deploys.
  tag: ""
  pullPolicy: IfNotPresent

# Toolchains, rendered into the mise.toml [tools] table.
#
# Empty is a valid install: nothing is installed until you add an entry. Pin
# exactly — a range makes mise resolve over the network on every start.
#
# Nested maps become TOML sub-tables, e.g. rust: { version: "...", profile: default }
# renders as [tools.rust].
tools: {}
  # go: "1.27.1"
  # node: "24.20.0"
  # python: "3.14.7"

# Extra container environment. `ZEROCLAW_`-prefixed keys set the daemon's own
# config, in schema-mirror form (ZEROCLAW_gateway__host).
env: {}

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  # No limits on purpose: this is a build host. A CPU/memory limit turns a slow
  # `cargo build` into an OOMKill instead.

storage:
  tools:
    size: 10Gi
  cache:
    size: 5Gi
  data:
    size: 10Gi

gateway:
  # The daemon supervises an HTTP gateway (dashboard, REST API, /health) on 42617.
  # Enabling the Service also fixes the bind: the PVC over /zeroclaw-data shadows
  # the image's baked config.toml, so the daemon would otherwise listen on
  # loopback and the Service would front a port nothing can dial.
  #
  # SECURITY: /health is unauthenticated. Anyone who can reach the Service can
  # read pairing state — which is why the default is in-cluster only.
  service:
    enabled: true
    type: ClusterIP
    port: 42617

# Pod placement, passed through verbatim. Kubernetes' own field names — there is
# nothing to translate, so there is no vocabulary to leak.
scheduling: {}
  # nodeSelector: {}
  # tolerations: []
  # affinity: {}
