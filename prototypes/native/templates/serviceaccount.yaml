{{/*
  The agent never talks to the API server, so it gets no token. app-template
  creates an unprivileged ServiceAccount by default but still mounts a token;
  owning the manifest means we can turn that off — and this is the kind of
  small, real improvement that only exists on the self-contained path.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nilchela.fullname" . }}
  labels:
    {{- include "nilchela.labels" . | nindent 4 }}
automountServiceAccountToken: false
