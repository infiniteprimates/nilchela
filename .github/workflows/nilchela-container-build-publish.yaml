# Build & publish the nilchela image to GHCR on version tags only.
#
# GHCR auto-creates the `ghcr.io/infiniteprimates/nilchela` package on first
# push, but it defaults to PRIVATE — set its visibility to "public" in the GHCR
# package settings to publish it. The workflow runs with the default
# GITHUB_TOKEN, which has `packages: write` via the `permissions` block below.
#
# Multi-arch: builds native amd64 + arm64 in parallel via buildx (both your
# x86 cluster and any arm64 host pull the correct manifest).
name: Nilchela Container Build and Publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]   # release only: v<semver> tags

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # infiniteprimates/nilchela

permissions:
  contents: read
  packages: write

jobs:
  container-build:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (for arm64 emulation during multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # Artifact Hub's own keys are annotations: that is the form it prefers,
          # and on a multi-arch image the index is where it looks first. The
          # org.opencontainers.image.* fields stay labels, because that is what
          # this action generates and what docker inspect shows.
          annotations: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/infiniteprimates/nilchela/main/README.md
            io.artifacthub.package.logo-url=https://raw.githubusercontent.com/infiniteprimates/nilchela/main/docs/assets/nilchela-logo.svg
          # The action emits org.opencontainers.image.description as an empty
          # label while the repository has no description. Override it, or the
          # listing indexes with no description at all.
          labels: |
            org.opencontainers.image.description=A thin, opinionated ZeroClaw dev image that installs mise-managed toolchains at runtime instead of baking them into the image.
        env:
          # Artifact Hub reads index-level annotations first on a multi-arch
          # image and falls back to image metadata, so annotate both levels.
          # This needs the build to produce an index -- it does, on two
          # platforms; a single-platform build would need 'index' dropped here.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

          # No build-args: ZEROCLAW_VERSION and MISE_VERSION default from the
          # Dockerfile ARG lines, the single source of truth. Bump there only.
          cache-from: type=gha
          cache-to: type=gha,mode=max
