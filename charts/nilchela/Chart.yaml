apiVersion: v2
name: nilchela
description: |
  Deploy nilchela — a thin, opinionated ZeroClaw dev image that installs
  mise-managed toolchains at runtime instead of baking them into the image.
type: application

# Chart version — bump on any chart change (SemVer). Starts at 0.0.0 to match
# the image's own versioning, which also begins at v0.0.0.
version: 0.0.0

# Application version — the nilchela IMAGE version this chart deploys by
# default. An empty `image.tag` in values.yaml means this value;
# tests/chart_contract.py fails the build if the two drift.
appVersion: "0.0.3"

# The bjw-s `common` library requires Kubernetes >= 1.31 -- read off the
# dependency's own Chart.yaml (`common` 5.1.0 declares `>=1.31.0-0`), not
# inferred from the chart this one was prototyped against. This mirrors its
# floor rather than a looser one of our own: declared here so Helm refuses early
# with a clear message rather than failing inside a template, and so the version
# we claim to support is the one the dependency actually supports.
kubeVersion: ">=1.31.0-0"

home: https://github.com/infiniteprimates/nilchela
sources:
  - https://github.com/infiniteprimates/nilchela

maintainers:
  - name: rawlink
    url: https://github.com/rawlink

# The chart is dual-licensed, same as the project. `license:` is NOT a valid key
# in an apiVersion v2 Chart.yaml — helm lint warns "unknown field" — so the
# licence is declared the supported way. Artifact Hub reads LICENSE files inside
# the chart package by default; this annotation provides it explicitly and must
# be a valid SPDX expression.
# Source: https://artifacthub.io/docs/topics/annotations/helm/
annotations:
  artifacthub.io/license: MIT OR Apache-2.0

# The dependency is `common` (type: library), NOT `app-template`. A library chart
# has no values interface of its own — it is a set of named templates. This
# chart's templates/resources.yaml calls `bjw-s.common.loader.all`, and the
# context it passes is built by templates/_translate.tpl from the native values
# in values.yaml. That translation is the whole mechanism; see README.md.
dependencies:
  - name: common
    # Pinned exactly, not a range: the library's template API is versioned, and
    # a silent minor bump can rename or restructure what the loader renders.
    # Bump deliberately and re-run tests/chart_contract.py.
    version: 5.1.0
    repository: https://bjw-s-labs.github.io/helm-charts
