# Fixture for the agentSecrets path-override case.
#
# It exists because helm-unittest's `set:` replaces an array element rather than
# merging into it, so two properties on the same item cannot both be set that way
# (`items[0].key` then `items[0].path` leaves an item with no `key`, which the
# values schema then rejects). The fixture says it the way a user would.
agentSecrets:
  agents:
    ted:
      apps:
        gh-token:
          secretName: agent-secrets-ted-gh
          items:
            - key: token
              path: gh/token
