# helm-unittest suites for the nilchela values surface.
#
# These cover LAYER 2 of the testing stack: template logic -- the conditionals,
# loops and variable derivations in templates/_translate.tpl -- asserted against
# literals, with no cluster. They deliberately do NOT replace
# tests/chart_contract.py: helm-unittest asserts a path against a literal, and
# cannot express a *relation* between two rendered locations (e.g. "main and
# install-tools mount the SAME volume at /tools"). Those stay in the contract
# test; see ci/chart.yaml for the layer split.
#
# Every document here comes from nilchela/templates/resources.yaml, which calls
# the bjw-s common library loader, so `templates` is that one file.
suite: nilchela values surface
# Render under the release name the chart is actually deployed as, so the
# fixtures read like a real install (`nilchela-tools`, not `release-name-...`).
release:
  name: nilchela
templates:
  - resources.yaml

tests:
  # ---------------------------------------------------------------------------
  # image
  # ---------------------------------------------------------------------------
  - it: defaults the image tag to the chart appVersion
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/infiniteprimates/nilchela:0.1.0

  - it: lets image.tag override the chart appVersion
    set:
      image.tag: "1.2.3"
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/infiniteprimates/nilchela:1.2.3

  - it: defaults the pull policy to IfNotPresent
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent

  - it: lets image.pullPolicy be overridden
    set:
      image.pullPolicy: Always
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always

  # ---------------------------------------------------------------------------
  # gateway.service -> Service + the derived bind
  # ---------------------------------------------------------------------------
  - it: renders a ClusterIP Service on the gateway port by default
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 42617

  - it: derives the off-loopback bind while the Service is enabled
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZEROCLAW_gateway__host
            value: "0.0.0.0"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZEROCLAW_gateway__allow_public_bind
            value: "true"

  # A probe is the *other* thing that needs the pod reachable: the kubelet dials
  # the pod IP, so the derived bind is driven by `or $svcEnabled $probesOn`, not by
  # the Service alone. To assert the Service's own contribution to the bind, both
  # sources have to be off -- with the shipped defaults (probes on) this expects an
  # env block, which is the suite's next case, not this one.
  - it: renders no Service and no bind env when nothing needs the pod reachable
    set:
      gateway.service.enabled: false
      probes.liveness.enabled: false
      probes.readiness.enabled: false
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].env

  # The regression this suite exists for: `$svc.enabled | default true` treated
  # `false` as empty, so the documented off-switch never worked. Count the docs.
  - it: drops the Service object itself when gateway.service.enabled is false
    set:
      gateway.service.enabled: false
    asserts:
      - hasDocuments:
          count: 6

  - it: renders the Service object when gateway.service.enabled is true
    asserts:
      - hasDocuments:
          count: 7

  - it: lets the Service type be overridden
    set:
      gateway.service.type: NodePort
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.type
          value: NodePort

  # ---------------------------------------------------------------------------
  # probes -> probe + the same derived bind
  # ---------------------------------------------------------------------------
  - it: renders readiness and liveness by default, and no startup probe
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe
      - isNotNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNull:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health

  - it: renders the derived readiness probe on /health
    set:
      probes.readiness.enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 42617
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTP

  # A probe is issued by the kubelet against the POD address, not loopback, so an
  # enabled probe has to fix the bind even when the Service is off. This is the
  # combination where getting it wrong is invisible.
  - it: keeps the bind env when the probes are on and the Service is not
    set:
      gateway.service.enabled: false
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZEROCLAW_gateway__host
            value: "0.0.0.0"
      - isNotNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: merges a raw probe spec over the derived probe
    set:
      probes.liveness.spec.initialDelaySeconds: 45
      probes.liveness.spec.failureThreshold: 5
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 45
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health

  - it: lets a probe override the shared probe port
    set:
      probes.port: 9999
      probes.startup.enabled: true
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 9999

  # ---------------------------------------------------------------------------
  # env passthrough
  # ---------------------------------------------------------------------------
  - it: passes user env through verbatim
    set:
      env.ZEROCLAW_models__default: some/model
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ZEROCLAW_models__default
            value: some/model

  # ---------------------------------------------------------------------------
  # mise.toml ConfigMap -- mise.tools and mise.env are separate tables
  # ---------------------------------------------------------------------------
  - it: renders an empty [tools] table and no [env] table by default
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["mise.toml"]
          pattern: "\\[tools\\]"
      - notMatchRegex:
          path: data["mise.toml"]
          pattern: "\\[env\\]"

  - it: renders a pinned tool into [tools]
    set:
      mise.tools.go: "1.27.1"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["mise.toml"]
          pattern: 'go = "1\.27\.1"'

  - it: renders a nested tool map as a TOML sub-table
    set:
      mise.tools.rust.version: "1.83.0"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["mise.toml"]
          pattern: "\\[tools\\.rust\\]"
      - matchRegex:
          path: data["mise.toml"]
          pattern: 'version = "1\.83\.0"'

  - it: quotes a tool key that is not a legal TOML bare key, and only that key
    # `pipx:` and `cargo:` are mise backend qualifiers, and a colon is not legal
    # in a TOML bare key. Rendered unquoted, the document does not parse at all,
    # so `mise install` — the install container's entire job — fails before the
    # pod starts. The second assertion is the other direction: a key that *can*
    # stand bare must stay bare, so the fix does not churn every existing render.
    set:
      mise.tools.pipx:trash-cli: "0.26.9.14"
      mise.tools.go: "1.27.1"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["mise.toml"]
          pattern: '(?m)^"pipx:trash-cli" = "0\.26\.9\.14"$'
      - matchRegex:
          path: data["mise.toml"]
          pattern: '(?m)^go = "1\.27\.1"$'

  - it: renders mise.env into the mise.toml [env] table
    set:
      mise.env.CARGO_HOME: /cache/cargo
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["mise.toml"]
          pattern: "\\[env\\]"
      - matchRegex:
          path: data["mise.toml"]
          pattern: 'CARGO_HOME = "/cache/cargo"'

  # ---------------------------------------------------------------------------
  # volumes.required — the image's contract
  # ---------------------------------------------------------------------------
  - it: renders the tools claim at its default size
    documentSelector:
      path: metadata.name
      value: nilchela-tools
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi

  - it: renders the cache claim at its default size
    documentSelector:
      path: metadata.name
      value: nilchela-cache
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  - it: lets a claim size be overridden
    set:
      volumes.required.cache.size: 20Gi
    documentSelector:
      path: metadata.name
      value: nilchela-cache
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: 20Gi

  - it: annotates created claims so an uninstall does not delete them
    documentSelector:
      path: metadata.name
      value: nilchela-data
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: adopts an existing claim instead of creating one, for every volume
    set:
      volumes.required.tools.existingClaim: zeroclaw-tools
      volumes.required.cache.existingClaim: zeroclaw-cache
      volumes.required.data.existingClaim: zeroclaw-data
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tools
            persistentVolumeClaim:
              claimName: zeroclaw-tools
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache
            persistentVolumeClaim:
              claimName: zeroclaw-cache
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: zeroclaw-data

  # ---------------------------------------------------------------------------
  # volumes.required — emptyDir: the no-provisioner and throwaway case
  # ---------------------------------------------------------------------------
  # emptyDir is opt-in and never the default, so each of the three has to be
  # reachable on its own — /cache is disposable, /tools is the cold install
  # the chart was built around, /zeroclaw-data is the daemon's state — and the
  # claim fields have to stop being accepted the moment it is chosen.
  - it: backs a required volume with an emptyDir when its type says so
    set:
      volumes.required.cache.type: emptyDir
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache
            emptyDir: {}

  - it: creates no claim for a required volume backed by an emptyDir
    set:
      volumes.required.cache.type: emptyDir
    asserts:
      - hasDocuments:
          count: 6

  # The library appends the identifier to a claim's name only when the chart
  # renders MORE THAN ONE claim (common: `itemCount > 1`). Left alone, flipping
  # two of the three to emptyDir would rename the survivor to the bare release
  # name — a new, empty claim beside the retained one it orphaned, which is the
  # one thing the `keep` annotation is there to prevent. The chart pins `suffix`,
  # so the name is the same in every combination.
  - it: keeps a required claim's name when the other two are emptyDir
    set:
      volumes.required.tools.type: emptyDir
      volumes.required.data.type: emptyDir
    documentSelector:
      path: metadata.name
      value: nilchela-cache
    asserts:
      - equal:
          path: kind
          value: PersistentVolumeClaim
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  - it: names an extra claim after its key, not after the claim count
    set:
      volumes.required.tools.type: emptyDir
      volumes.required.cache.type: emptyDir
      volumes.required.data.type: emptyDir
      volumes.extra.media.size: 100Gi
    documentSelector:
      path: metadata.name
      value: nilchela-media
    asserts:
      - equal:
          path: kind
          value: PersistentVolumeClaim

  - it: renders emptyDir medium and sizeLimit
    set:
      volumes.required.cache.type: emptyDir
      volumes.required.cache.medium: Memory
      volumes.required.cache.sizeLimit: 1Gi
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi

  - it: backs all three required volumes independently
    set:
      volumes.required.tools.type: emptyDir
      volumes.required.data.type: emptyDir
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tools
            emptyDir: {}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            emptyDir: {}
      # The claim that is left is still a claim, under the same name: the chart
      # pins each claim's `suffix`, so its name does not depend on how many other
      # claims happen to be rendered. Without the pin the library would name it
      # after the *count* — one claim left is `<release>`, not `<release>-cache`
      # — and a volume turning ephemeral would silently rename (and orphan) the
      # others.
      - contains:
          path: spec.template.spec.volumes
          content:
            name: cache
            persistentVolumeClaim:
              claimName: nilchela-cache

  # The split that makes /tools work is per-container, not per-volume: the
  # installer keeps its writable mount and the agent keeps read-only, whatever
  # backs the path. An emptyDir is where losing that would be invisible, since the
  # failure mode is an empty directory rather than a k8s error.
  - it: keeps the /tools ownership split when the tools volume is an emptyDir
    set:
      volumes.required.tools.type: emptyDir
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tools
            mountPath: /tools
            readOnly: true
      - contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: tools
            mountPath: /tools

  - it: refuses a claim size beside type emptyDir
    set:
      volumes.required.cache.type: emptyDir
      volumes.required.cache.size: 5Gi
    asserts:
      - failedTemplate:
          errorMessage: "volumes.required.cache: type emptyDir creates no claim, so size cannot be set; drop one of the two"

  - it: refuses a storage class beside type emptyDir
    set:
      volumes.required.cache.type: emptyDir
      volumes.required.cache.storageClass: fast
    asserts:
      - failedTemplate:
          errorMessage: "volumes.required.cache: type emptyDir creates no claim, so storageClass cannot be set; drop one of the two"

  - it: refuses an adopted claim beside type emptyDir
    set:
      volumes.required.cache.type: emptyDir
      volumes.required.cache.existingClaim: zeroclaw-cache
    asserts:
      - failedTemplate:
          errorMessage: "volumes.required.cache: type emptyDir creates no claim, so existingClaim cannot be set; drop one of the two"

  - it: refuses an emptyDir field on a claim
    set:
      volumes.required.cache.medium: Memory
    asserts:
      - failedTemplate:
          errorMessage: "volumes.required.cache: medium is an emptyDir field and this volume is a persistentVolumeClaim; set type: emptyDir or drop it"

  # ---------------------------------------------------------------------------
  # volumes.extra — what the deployer adds. The key IS the mount path.
  # ---------------------------------------------------------------------------
  - it: mounts an extra claim at the path its key names
    set:
      volumes.extra.media.existingClaim: media
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: media
            persistentVolumeClaim:
              claimName: media
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: media
            mountPath: /media

  - it: a path override moves the mount without renaming the volume
    set:
      volumes.extra.media.existingClaim: media
      volumes.extra.media.path: /mnt/media
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: media
            persistentVolumeClaim:
              claimName: media
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: media
            mountPath: /mnt/media

  - it: mounts an extra volume in the agent container and no other
    set:
      volumes.extra.media.existingClaim: media
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: media
      - notContains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: media

  # The one bare entry this surface refuses: an entry that names no `type` defaults
  # to a claim, and a claim with neither a size nor an adopted claim renders
  # `size:` empty — which k8s rejects at sync, naming neither the key nor the
  # field. There is no chart default to fall back on here, unlike the three
  # required volumes, whose paths and sizes are the image's contract.
  - it: refuses an extra claim with neither a size nor an adopted claim
    set:
      volumes.extra.media: {}
    asserts:
      - failedTemplate:
          errorMessage: "volumes.extra.media: type persistentVolumeClaim needs size or existingClaim"

  - it: refuses an extra key the chart already owns
    set:
      volumes.extra.tools.existingClaim: some-claim
    asserts:
      - failedTemplate:
          errorMessage: "volumes.extra.tools: the chart already owns a volume under this name; choose another key"

  - it: refuses an extra volume on a path the chart owns
    set:
      volumes.extra.mytools.existingClaim: some-claim
      volumes.extra.mytools.path: /tools
    asserts:
      - failedTemplate:
          errorMessage: "volumes.extra.mytools: /tools is mounted by the chart; choose another path"

  - it: refuses two extra keys resolving to one mount path
    set:
      volumes.extra.one.existingClaim: claim-a
      volumes.extra.two.existingClaim: claim-b
      volumes.extra.two.path: /one
    asserts:
      - failedTemplate:
          errorMessage: "volumes.extra.two: /one is already mounted by volumes.extra.one"

  # ---------------------------------------------------------------------------
  # scheduling passthrough
  # ---------------------------------------------------------------------------
  - it: passes scheduling through to the pod spec unchanged
    set:
      scheduling.nodeSelector.disktype: ssd
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.disktype
          value: ssd

  # ---------------------------------------------------------------------------
  # the pod model's fixed halves
  # ---------------------------------------------------------------------------
  - it: runs the main container as the non-root agent
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: mounts /tools read-only for the agent
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tools
            mountPath: /tools
            readOnly: true

  - it: mounts /tools writable for the root installer
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - contains:
          path: spec.template.spec.initContainers[1].volumeMounts
          content:
            name: tools
            mountPath: /tools

  - it: orders fix-ownership before install-tools
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: fix-ownership
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: install-tools

  - it: runs the installer as root and chowns the write targets
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[0].command[0]
          value: chown
      - equal:
          path: spec.template.spec.initContainers[0].args[0]
          value: 65534:65534

  - it: installs toolchains with mise
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].command[0]
          value: mise
      - equal:
          path: spec.template.spec.initContainers[1].args[0]
          value: install

  # ---------------------------------------------------------------------------
  # volumes.extra nested inside a chart volume -> prepare-mounts
  #
  # The kubelet creates a missing mount point as root:root, and it creates one per
  # container -- so the directories under an extra mount path appear while the
  # agent container is being set up, after every init container has exited, and
  # `fix-ownership` (non-recursive, by design) is already past. On a fresh volume
  # the agent then cannot write, and the daemon dies at boot creating its own data
  # directory. The chart creates and chowns that chain itself, in an init container
  # rendered only when an extra path is actually nested.
  # ---------------------------------------------------------------------------
  - it: renders no prepare-mounts when no extra path is nested
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2

  - it: renders no prepare-mounts for an extra mounted outside the chart's volumes
    set:
      volumes.extra.media:
        type: persistentVolumeClaim
        existingClaim: media
        path: /media
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2

  - it: creates and chowns the parent chain of a nested extra path
    set:
      volumes.extra.agent-secrets:
        type: projected
        path: /zeroclaw-data/.zeroclaw/agents/testagent/workspace/secrets
        sources:
          - secret:
              name: test-token
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 3
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: prepare-mounts
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[1].args[0]
          value: |-
            set -eu
            for dir in "/zeroclaw-data/.zeroclaw" "/zeroclaw-data/.zeroclaw/agents" "/zeroclaw-data/.zeroclaw/agents/testagent" "/zeroclaw-data/.zeroclaw/agents/testagent/workspace"; do
              mkdir -p "$dir"
              chown 65534:65534 "$dir"
            done
      # The mount point itself is the last path component, and it is covered by its
      # own mount: chowning it would fail on a read-only source and mean nothing.
      - notMatchRegex:
          path: spec.template.spec.initContainers[1].args[0]
          pattern: workspace/secrets
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: install-tools

  - it: prepare-mounts carries none of the deployer's extra volumes
    set:
      volumes.extra.agent-secrets:
        type: projected
        path: /zeroclaw-data/.zeroclaw/agents/testagent/workspace/secrets
        sources:
          - secret:
              name: test-token
    documentSelector:
      path: kind
      value: StatefulSet
    asserts:
      - lengthEqual:
          path: spec.template.spec.initContainers[1].volumeMounts
          count: 3
